<svg xmlns="http://www.w3.org/2000/svg" width="600" height="370" viewBox="0 0 600 370" role="img" aria-label="Director-Actor Partnerships. M.Sc. Cloud Computing. Best director-actor pairs on 3.6 GB of IMDb with Hadoop and Spark.">
<title>Director-Actor Partnerships. M.Sc. Cloud Computing. Best director-actor pairs on 3.6 GB of IMDb with Hadoop and Spark.</title>
<style>
.serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif; }
.sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
.ink, .acc, .mut, .fnt { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.ink { stroke: #1d3b2f; }
.acc { stroke: #2f7d4f; stroke-width: 2.6; }
.mut { stroke: #6b7a70; }
.fnt { stroke: #c9cfc3; stroke-width: 1.6; }
.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.8s ease-in-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.fade { opacity: 0; animation: fade 1s ease-out forwards; }
@keyframes fade { to { opacity: 1; } }
.flow { animation: flow 2.4s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -60; } }
.spin { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.bob { animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
.beat { transform-box: fill-box; transform-origin: center; animation: beat 1.6s ease-in-out infinite; }
@keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.12); } 30% { transform: scale(1); } 45% { transform: scale(1.08); } }

.clap { transform-box: fill-box; transform-origin: 0% 100%; animation: clap 2.6s ease-in-out infinite; }
@keyframes clap { 0%,60%,100% { transform: rotate(0); } 70% { transform: rotate(-14deg); } 85% { transform: rotate(0); } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; stroke-dashoffset: 0 !important; opacity: 1 !important; }
  .ph { opacity: 0 !important; } .ph0 { opacity: 1 !important; transform: none !important; }
  .lvl { opacity: 0.9 !important; } }
</style>
<defs>
  <filter id="hand" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/>
    <feDisplacementMap in="SourceGraphic" scale="2.2"/>
  </filter>
</defs>
<rect width="600" height="370" rx="14" fill="#f5f2e9"/>

<rect x="5" y="5" width="590" height="360" rx="16" fill="none" stroke="#6b7a70" stroke-opacity="0.5" stroke-width="1.5"/>
<g transform="translate(0,12)"><g filter="url(#hand)"><path d="M80,250 H520" class="ink draw" pathLength="1" style="animation-delay:0.00s"/><path d="M140,150 H300 V250 H140 Z" class="ink draw" pathLength="1" style="animation-delay:0.10s"/><path d="M140,150 V128 H300 V150" class="ink draw" pathLength="1" style="animation-delay:0.16s"/><path d="M170,128 L155,150 M210,128 L195,150 M250,128 L235,150 M290,128 L275,150" class="ink draw" pathLength="1" style="animation-delay:0.22s"/><path d="M160,190 H280 M160,215 H240" class="ink draw" pathLength="1" style="animation-delay:0.28s"/><g class="clap"><path d="M140,124 L300,124 L300,104 L140,104 Z" class="ink"/><path d="M168,104 L182,124 M208,104 L222,124 M248,104 L262,124" class="ink"/></g><path d="M380,105 C362,105 358,80 380,77 C382,55 410,48 422,64 C432,44 470,50 468,76 C490,76 494,105 472,105 Z" class="ink draw" pathLength="1" style="animation-delay:0.50s"/><path d="M425,112 L380,160 M425,112 V160 M425,112 L470,160" class="acc flow" stroke-dasharray="7 7"/><path d="M380,174 L425,222 M425,174 V222 M470,174 L425,222" class="acc flow" stroke-dasharray="7 7"/><circle cx="380" cy="167" r="7" fill="#f5f2e9" class="ink"/><circle cx="425" cy="167" r="7" fill="#f5f2e9" class="ink"/><circle cx="470" cy="167" r="7" fill="#f5f2e9" class="ink"/><path d="M425,222 l5,11 12,1 -9,8 3,12 -11,-6 -11,6 3,-12 -9,-8 12,-1 Z" fill="#2f7d4f" fill-opacity="0.25" class="acc"/></g></g>
