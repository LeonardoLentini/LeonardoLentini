<text x="40" y="326" font-size="22" fill="#1d3b2f" class="serif">Director-Actor Partnerships<tspan font-size="14" fill="#2f7d4f" class="sans" dx="10">M.Sc. Cloud Computing</tspan></text>
<text x="40" y="350" font-size="15" fill="#6b7a70" class="sans">Best director-actor pairs on 3.6 GB of IMDb with Hadoop and Spark</text>

