<title>Timeline drawn as the skyline of Pisa along the Arno. 2021: B.Sc. in Computer Engineering starts. 2025: B.Sc. degree. 2025: M.Sc. in AI and Data Engineering starts, by the Leaning Tower. Next: still writing it.</title>
