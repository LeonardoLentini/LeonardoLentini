<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-label="Leonardo Lentini. M.Sc. student in AI and Data Engineering at the University of Pisa.">
<title>Leonardo Lentini. M.Sc. student in AI and Data Engineering at the University of Pisa.</title>
<style>
.serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif; }
.sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
.ink, .acc, .mut, .fnt { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.ink { stroke: #dfeae2; }
.acc { stroke: #5fbf7f; stroke-width: 2.6; }
.mut { stroke: #8fa496; }
.fnt { stroke: #2c3a31; stroke-width: 1.6; }
.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.8s ease-in-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.fade { opacity: 0; animation: fade 1s ease-out forwards; }
@keyframes fade { to { opacity: 1; } }
.flow { animation: flow 2.4s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -60; } }
.spin { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.bob { animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
.beat { transform-box: fill-box; transform-origin: center; animation: beat 1.6s ease-in-out infinite; }
@keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.12); } 30% { transform: scale(1); } 45% { transform: scale(1.08); } }
.ph { opacity: 0; animation: ph 18.0s linear infinite; }
@keyframes ph { 0% { opacity: 0; transform: translateY(6px); } 3.00% { opacity: 1; transform: none; } 22.00% { opacity: 1; transform: none; } 25.00% { opacity: 0; transform: translateY(-6px); } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; stroke-dashoffset: 0 !important; opacity: 1 !important; }
  .ph { opacity: 0 !important; } .ph0 { opacity: 1 !important; transform: none !important; }
  .lvl { opacity: 0.9 !important; } }
</style>
<defs>
  <filter id="hand" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/>
    <feDisplacementMap in="SourceGraphic" scale="2.2"/>
  </filter>
</defs>
<rect width="1200" height="270" rx="14" fill="#0f1813"/>

<text x="60" y="104" font-size="60" fill="#dfeae2" class="serif fade" style="animation-delay:0.1s">Leonardo Lentini</text>
<text x="62" y="144" font-size="18" fill="#8fa496" class="sans fade" style="animation-delay:0.4s" letter-spacing="0.3">AI &amp; Data Engineering · University of Pisa</text>
<text x="60" y="210" font-size="48" fill="#5fbf7f" class="serif fade" style="animation-delay:0.8s">“</text>
<text x="92" y="200" font-size="21" font-style="italic" fill="#dfeae2" class="serif ph ph0" style="animation-delay:0.0s">Placeholder phrase number one, something I believe in.</text><text x="92" y="200" font-size="21" font-style="italic" fill="#dfeae2" class="serif ph ph1" style="animation-delay:4.5s">A second line about how I like to work.</text><text x="92" y="200" font-size="21" font-style="italic" fill="#dfeae2" class="serif ph ph2" style="animation-delay:9.0s">Something I'm curious about lately.</text><text x="92" y="200" font-size="21" font-style="italic" fill="#dfeae2" class="serif ph ph3" style="animation-delay:13.5s">A small personal motto to close the loop.</text>
